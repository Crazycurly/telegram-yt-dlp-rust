services:
  # Self-hosted Bot API server: raises the upload limit from 50 MB to 2 GB.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DOWNLOAD_DIR: /downloads
      # Talk to the local server (overrides any TELEGRAM_API_URL in .env).
      TELEGRAM_API_URL: http://telegram-bot-api:8081
    volumes:
      # Named volume (not a host bind mount) so it inherits the image's
      # bot-owned /downloads; downloads are ephemeral (cleaned per job).
      - downloads:/downloads
    depends_on:
      - telegram-bot-api

volumes:
  telegram-bot-api-data:
  downloads:
