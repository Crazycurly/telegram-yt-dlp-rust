[package]
name = "telegram-yt-dlp-rust"
version = "0.1.0"
edition = "2021"
description = "Telegram bot that downloads videos via yt-dlp with an inline menu, live progress bar and MP3 conversion"
license = "MIT"

[dependencies]
teloxide = { version = "0.17", default-features = false, features = ["rustls", "macros", "ctrlc_handler"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "fs", "time", "sync", "signal"] }
tokio-util = "0.7"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = "thin"
